
name: Viral Moment Clip Generator

on:
  workflow_run:
    workflows:
      - "Viral Moment JSON Generator"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: viral-clip-generator
  cancel-in-progress: false

jobs:
  generate-clips:
    # Run after the JSON generator only when it succeeds.
    # Manual workflow_dispatch runs are also allowed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        run: |
          test -f viral_moments/clip_generator.py
          test -f viral_video_queue.csv
          test -d results
          test -d videos

      - name: Generate Shorts from CSV queue
        run: |
          python viral_moments/clip_generator.py

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: viral-generated-clips
          path: clips/*.mp4
          if-no-files-found: warn
          retention-days: 7
