
name: Viral Moment Clip Generator

on:
  schedule:
    - cron: "30 17 * * *"  # Daily at 11:00 PM IST
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: viral-clip-generator
  cancel-in-progress: false

jobs:
  generate-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_MOMENT
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      GDRIVE_SOURCE_FOLDER_ID: ${{ secrets.GDRIVE_SOURCE_FOLDER_ID }}
      GDRIVE_JSON_FOLDER_ID: ${{ secrets.GDRIVE_JSON_FOLDER_ID }}
      GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-generator-requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-generator-requirements.txt

      - name: Verify required files
        run: |
          test -f viral_clip_generator.py
          test -f caption_generator.py
          test -d sticker
          test -f viral_moment_queue.csv

      - name: Generate Viral Moment Clips
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
        run: |
          python viral_clip_generator.py
