name: Viral Moment Clip Generator

on:
  schedule:
    - cron: "30 17 * * *"  # Daily at 11:00 PM IST
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: viral-clip-generator
  cancel-in-progress: false

jobs:
  generate-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_MOMENT
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      GDRIVE_SOURCE_FOLDER_ID: ${{ secrets.GDRIVE_SOURCE_FOLDER_ID }}
      GDRIVE_JSON_FOLDER_ID: ${{ secrets.GDRIVE_JSON_FOLDER_ID }}
      GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}

    steps:
      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # PYTHON SETUP
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-generate-requirements.txt

      # INSTALL FFMPEG
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # INSTALL DEPENDENCIES
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-generate-requirements.txt

      # VERIFY REQUIRED FILES
      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f viral_clip_generator.py
          test -f caption_generator.py
          test -d sticker
          test -f viral_moment_queue.csv

          echo "Checking Google Drive credentials..."
          test -n "$GDRIVE_TOKEN_JSON"

          echo "Checking repository YouTube token..."
          test -f token.json

          python -c "import json; json.load(open('token.json', encoding='utf-8'))"

          echo "Checking channel..."
          test "$CHANNEL" = "VIRAL_MOMENT"

          echo "All required files and configuration verified."

      # GENERATE CLIPS
      - name: Generate Viral Moment Clips
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
        run: |
          set -euo pipefail

          echo "Starting Viral Moment clip generation..."
          echo "Channel: $CHANNEL"

          python -u viral_clip_generator.py