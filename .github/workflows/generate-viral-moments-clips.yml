name: Viral Moment Clip Generator

on:
  schedule:
    - cron: "30 17 * * *" # Daily at 11:00 PM IST
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: viral-moment-clip-generate
  cancel-in-progress: false

jobs:
  generate-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_MOMENT
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      GDRIVE_SOURCE_FOLDER_ID: ${{ secrets.GDRIVE_SOURCE_FOLDER_ID }}
      GDRIVE_JSON_FOLDER_ID: ${{ secrets.GDRIVE_JSON_FOLDER_ID }}
      GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # PYTHON SETUP
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-generate-requirements.txt

      # --------------------------------------------------
      # INSTALL FFMPEG
      # --------------------------------------------------

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-generate-requirements.txt

      # --------------------------------------------------
      # VERIFY REQUIRED FILES
      # --------------------------------------------------

      - name: Verify required files
        run: |
          set -e

          test -f viral_clip_generator.py
          test -f caption_generator.py
          test -d sticker
          test -f viral-clip-generate-requirements.txt
          test -f viral_moment_queue.csv

          echo "Required files verified."

      # --------------------------------------------------
      # VERIFY GOOGLE DRIVE CONFIGURATION
      # --------------------------------------------------

      - name: Verify Google Drive configuration
        run: |
          set -e

          if [ -z "$GDRIVE_TOKEN_JSON" ]; then
            echo "::error::GDRIVE_TOKEN_JSON secret is missing."
            exit 1
          fi

          if [ -z "$GDRIVE_SOURCE_FOLDER_ID" ]; then
            echo "::error::GDRIVE_SOURCE_FOLDER_ID secret is missing."
            exit 1
          fi

          if [ -z "$GDRIVE_JSON_FOLDER_ID" ]; then
            echo "::error::GDRIVE_JSON_FOLDER_ID secret is missing."
            exit 1
          fi

          if [ -z "$GDRIVE_CLIPS_FOLDER_ID" ]; then
            echo "::error::GDRIVE_CLIPS_FOLDER_ID secret is missing."
            exit 1
          fi

          echo "Google Drive configuration found."

      # --------------------------------------------------
      # GENERATE VIRAL MOMENT CLIPS
      # --------------------------------------------------

      - name: Generate Viral Moment clips
        run: |
          echo "Environment: $ENV"
          echo "Channel: $CHANNEL"

          python viral_clip_generator.py

      # --------------------------------------------------
      # VERIFY GENERATED CLIPS
      # --------------------------------------------------

      - name: Verify generated clips
        run: |
          set -e

          if [ -d "clips/viral-moment" ]; then
            COUNT=$(find clips/viral-moment -maxdepth 1 -type f -name "*.mp4" | wc -l)
            echo "Local generated clips: $COUNT"
          else
            echo "Local clips directory not found."
          fi

          echo "Viral Moment clip generation workflow completed."

        # --------------------------------------------------
        # SAVE UPDATED QUEUE CSV TO GITHUB
        # --------------------------------------------------

      - name: Commit updated queue CSV
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_moment_queue.csv

          if git diff --cached --quiet; then
            echo "[QUEUE] No CSV changes to commit."
          else
            git commit -m "Update Viral Moment clip queue [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "[QUEUE][SUCCESS] CSV updated on GitHub."
          fi