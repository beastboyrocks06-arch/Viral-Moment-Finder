
name: Viral Moment Clip Generator

on:
  workflow_run:
    workflows:
      - "Viral Moment JSON Generator"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: viral-clip-generator
  cancel-in-progress: false

jobs:
  generate-clips:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_MOMENT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-httplib2 python-dotenv

      - name: Verify required files
        run: |
          test -f viral_clip_generator.py
          test -f caption_generator.py
          test -d sticker
          test -f viral_moment_queue.csv

      - name: Generate Viral Moment Clips
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_SOURCE_FOLDER_ID: ${{ secrets.GDRIVE_SOURCE_FOLDER_ID }}
        run: |
          python viral_clip_generator.py

      - name: Upload clips to Google Drive
        if: success()
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          clips = sorted(Path("clips/viral-moment").glob("*.mp4"))

          if not clips:
              print("[INFO] No MP4 files found.")
              raise SystemExit(0)

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GDRIVE_CREDENTIALS"]),
              scopes=["https://www.googleapis.com/auth/drive"]
          )

          service = build("drive", "v3", credentials=credentials)
          folder_id = os.environ["GDRIVE_CLIPS_FOLDER_ID"]

          for clip in clips:
              media = MediaFileUpload(
                  str(clip),
                  mimetype="video/mp4",
                  resumable=True
              )

              uploaded = service.files().create(
                  body={"name": clip.name, "parents": [folder_id]},
                  media_body=media,
                  fields="id,name",
                  supportsAllDrives=True
              ).execute()

              print(f"[SUCCESS] Uploaded to Google Drive: {uploaded['name']}")

          print(f"[DONE] {len(clips)} MP4 files uploaded.")
          PY
