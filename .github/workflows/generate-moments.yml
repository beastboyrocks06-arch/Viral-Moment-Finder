
name: Nightly Viral Moment JSON Generator

on:
  schedule:
    # Every day at 9:00 PM India time (15:30 UTC)
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viral-json-generator
  cancel-in-progress: false

jobs:
  generate-json:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model file
        run: |
          ls -lh models/
          test -f models/qwen2.5-1.5b-instruct-q4_k_m.gguf

      - name: Generate pending JSON files
        run: |
          python queue_json_generator.py

      - name: Commit generated JSON and queue updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_video_queue.csv viral_moments/results/

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate nightly viral moment JSON"
            git push
          else
            echo "No changes to commit."
          fi
