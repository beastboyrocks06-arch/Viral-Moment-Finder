name: Viral Moment JSON Generator

on:
  schedule:
    - cron: "30 11 * * *" # Daily, 5 PM IST
  workflow_dispatch:
    inputs:
      channel:
        description: "Select the channel"
        required: true
        type: choice
        default: VIRAL_MOMENT
        options:
          - VIRAL_MOMENT
          - DOCUMENTARY_MOMENT

permissions:
  contents: write

concurrency:
  group: moment-json-generator
  cancel-in-progress: false

jobs:
  generate-json:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: ${{ github.event.inputs.channel || 'VIRAL_MOMENT' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Qwen Model Cache
        id: qwen-cache
        uses: actions/cache/restore@v4
        with:
          path: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: qwen2.5-1.5b-instruct-q4_k-m-v1

      - name: Verify Qwen Model Cache
        run: |
          MODEL="models/qwen2.5-1.5b-instruct-q4_k_m.gguf"

          if [ ! -s "$MODEL" ]; then
            echo "::error::Qwen model cache missing or not restored."
            echo "Run the Prepare Qwen Model workflow on the default branch first."
            exit 1
          fi

          SIZE=$(stat -c%s "$MODEL")

          if [ "$SIZE" -lt 500000000 ]; then
            echo "::error::Qwen model file is incomplete or invalid."
            exit 1
          fi

          ls -lh "$MODEL"
          echo "Qwen model cache restored successfully."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install llama-cpp-python
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      
      - name: Test Google Drive Connection
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_SOURCE_FOLDER_ID: ${{ secrets.GDRIVE_SOURCE_FOLDER_ID }}
          GDRIVE_JSON_FOLDER_ID: ${{ secrets.GDRIVE_JSON_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          raw = os.environ.get("GDRIVE_CREDENTIALS", "").strip()
          if not raw:
              raise RuntimeError("GDRIVE_CREDENTIALS secret is missing or empty.")

          try:
              service_account_info = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise RuntimeError("GDRIVE_CREDENTIALS is not valid JSON.") from exc

          if service_account_info.get("type") != "service_account":
              raise RuntimeError("Invalid Google service-account credentials.")

          credentials = Credentials.from_service_account_info(
              service_account_info,
              scopes=["https://www.googleapis.com/auth/drive"]
          )

          drive = build("drive", "v3", credentials=credentials)

          for folder in ["GDRIVE_SOURCE_FOLDER_ID", "GDRIVE_JSON_FOLDER_ID"]:
              folder_id = os.environ.get(folder, "").strip()
              if not folder_id:
                  raise RuntimeError(f"{folder} secret is missing or empty.")

              result = drive.files().get(
                  fileId=folder_id,
                  fields="id,name,mimeType",
                  supportsAllDrives=True
              ).execute()

              if result["mimeType"] != "application/vnd.google-apps.folder":
                  raise RuntimeError(f"{folder} is not a Google Drive folder.")

              print(f"{folder}: {result['name']} - OK")

          print("Google Drive connection successful!")
          PY


      - name: Generate pending JSON files
        env:
          ENV: PROD
          CHANNEL: VIRAL_MOMENT
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_SOURCE_FOLDER_ID: ${{ secrets.GDRIVE_SOURCE_FOLDER_ID }}
          GDRIVE_JSON_FOLDER_ID: ${{ secrets.GDRIVE_JSON_FOLDER_ID }}
        run: |
          echo "Environment: $ENV"
          echo "Channel: $CHANNEL"
          python viral_moment_json_generator.py

      - name: Commit generated JSON and queue updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_moment_queue.csv results/

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate $CHANNEL JSON"
            git push
          else
            echo "No changes to commit."
          fi