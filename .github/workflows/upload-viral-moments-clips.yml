name: Viral Moment Youtube Uploader

on:
  schedule:
    - cron: "30 2 * * *"  # 8:00 AM IST
    - cron: "30 14 * * *" # 8:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viral-moment-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_MOMENT
      MAX_UPLOADS_PER_RUN: "1"
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_CATEGORY_ID: "24"
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}

    steps:
      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PYTHON SETUP
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-uploader-requirements.txt

      # INSTALL DEPENDENCIES
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-uploader-requirements.txt

      # VERIFY PROJECT FILES AND OAUTH
      - name: Verify uploader configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking uploader script..."
          test -f viral_moment_clip_uploader.py

          echo "Checking queue..."
          test -f viral_moment_queue.csv

          test -f viral-clip-uploader-requirements.txt

          mkdir -p clips/viral-moment
          mkdir -p results/viral-moment

          echo "Checking repository YouTube token..."
          test -f viral_moment_token.json

          python -c "import json; json.load(open('viral_moment_token.json', encoding='utf-8'))"

          echo "Checking Google Drive token..."
          test -n "$GDRIVE_TOKEN_JSON"

          echo "Checking Google Drive clips folder..."
          test -n "$GDRIVE_CLIPS_FOLDER_ID"

          echo "Checking selected channel..."
          test "$CHANNEL" = "VIRAL_MOMENT"

          echo "Queue columns:"
          head -n 1 viral_moment_queue.csv

          echo "Configuration checks passed."

      # UPLOAD VIRAL MOMENT
      - name: Upload Viral Moment videos
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Viral Moment uploader..."
          echo "Channel: $CHANNEL"

          python -u viral_moment_clip_uploader.py --channel VIRAL_MOMENT

      # SAVE QUEUE AND LOCAL JSON PROGRESS
      - name: Save upload progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_moment_queue.csv
          git add results/viral-moment/

          if git diff --cached --quiet; then
            echo "No upload progress changes to save."
          else
            git commit -m "Update Viral Moment upload progress"

            echo "Syncing with remote main..."
            git pull --rebase --autostash origin main

            echo "Pushing upload progress..."
            git push origin HEAD:main
          fi

      # CLEANUP
      - name: Cleanup OAuth files
        if: always()
        run: |
          rm -f viral_moment_token.json
          echo "OAuth cleanup completed."