
name: Viral Moment Clip Uploader

on:
  schedule:
    - cron: "30 2 * * *"  # 8:00 AM IST
    - cron: "30 14 * * *" # 8:00 PM IST
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: youtube-scheduled-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # PYTHON SETUP
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-uploader-requirements.txt

      # --------------------------------------------------
      # SYSTEM DEPENDENCIES
      # --------------------------------------------------
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # --------------------------------------------------
      # PYTHON DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-uploader-requirements.txt

      # --------------------------------------------------
      # YOUTUBE OAUTH
      # --------------------------------------------------
      - name: Configure YouTube OAuth
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_B64" ]; then
            echo "YouTube token secret is missing."
            exit 1
          fi

          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json

          python -c "import json; json.load(open('token.json'))"
          echo "YouTube OAuth token configured."

      # --------------------------------------------------
      # VERIFY PROJECT FILES AND CLIPS
      # --------------------------------------------------
      - name: Verify uploader files
        run: |
          test -f viral_moment_clip_uploader.py
          test -f viral_moment_queue.csv
          test -f token.json

          mkdir -p clips/viral-moment
          echo "Viral Moment clips:"
          find clips/viral-moment -maxdepth 1 -type f -name "*.mp4" -printf "%f\n"

      # --------------------------------------------------
      # GOOGLE DRIVE OAUTH VALIDATION
      # --------------------------------------------------
      - name: Verify Google Drive OAuth configuration
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_JSON_FOLDER_ID: ${{ secrets.GDRIVE_JSON_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_TOKEN_JSON" ]; then
            echo "Google Drive OAuth token is missing."
            exit 1
          fi

          if [ -z "$GDRIVE_JSON_FOLDER_ID" ]; then
            echo "Google Drive JSON folder ID is missing."
            exit 1
          fi

          echo "Google Drive OAuth configuration found."

      # --------------------------------------------------
      # UPLOAD VIRAL MOMENT
      # --------------------------------------------------
      - name: Upload Viral Moment videos
        env:
          ENV: PROD
          CHANNEL: VIRAL_MOMENT
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_JSON_FOLDER_ID: ${{ secrets.GDRIVE_JSON_FOLDER_ID }}
          YOUTUBE_PRIVACY_STATUS: private
        run: |
          python viral_moment_clip_uploader.py

      # --------------------------------------------------
      # SAVE QUEUE PROGRESS
      # --------------------------------------------------
      - name: Save upload progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_moment_queue.csv

          if git diff --cached --quiet; then
            echo "No queue progress changes to save."
          else
            git commit -m "Update YouTube upload progress"
            git push
          fi

      # --------------------------------------------------
      # CLEANUP
      # --------------------------------------------------
      - name: Cleanup OAuth files
        if: always()
        run: |
          rm -f token.json
