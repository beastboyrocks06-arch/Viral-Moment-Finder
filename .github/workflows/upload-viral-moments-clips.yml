
name: Viral Moment Clip Uploader

on:
  schedule:
    - cron: "30 2 * * *"  # 8:00 AM IST
    - cron: "30 14 * * *" # 8:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-scheduled-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # PYTHON SETUP
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-uploader-requirements.txt

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-uploader-requirements.txt

      # --------------------------------------------------
      # VERIFY PROJECT FILES
      # --------------------------------------------------
      - name: Verify uploader files
        run: |
          set -e

          test -f viral_moment_clip_uploader.py
          test -f viral_moment_queue.csv
          test -f viral-clip-uploader-requirements.txt

          mkdir -p clips/viral-moment
          mkdir -p results/viral-moment

          echo "Uploader files verified."

          echo "Queue columns:"
          head -n 1 viral_moment_queue.csv

          echo "Queue preview:"
          head -n 5 viral_moment_queue.csv

      # --------------------------------------------------
      # YOUTUBE OAUTH
      # --------------------------------------------------
      - name: Configure YouTube OAuth
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          set -e

          if [ -z "$YOUTUBE_TOKEN_B64" ]; then
            echo "YouTube token secret is missing."
            exit 1
          fi

          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json

          python -c "import json; json.load(open('token.json'))"

          echo "YouTube OAuth token configured."

      # --------------------------------------------------
      # GOOGLE DRIVE OAUTH VALIDATION
      # Drive is used ONLY for MP4 downloads.
      # --------------------------------------------------
      - name: Verify Google Drive OAuth configuration
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}
        run: |
          set -e

          if [ -z "$GDRIVE_TOKEN_JSON" ]; then
            echo "Google Drive OAuth token is missing."
            exit 1
          fi

          if [ -z "$GDRIVE_CLIPS_FOLDER_ID" ]; then
            echo "Google Drive generated-clips folder ID is missing."
            exit 1
          fi

          echo "Google Drive OAuth configuration found."

      # --------------------------------------------------
      # UPLOAD VIRAL MOMENT
      # --------------------------------------------------
      - name: Upload Viral Moment videos
        env:
          ENV: PROD
          CHANNEL: VIRAL_MOMENT

          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}

          YOUTUBE_PRIVACY_STATUS: private
        run: |
          python viral_moment_clip_uploader.py

      # --------------------------------------------------
      # SAVE QUEUE AND LOCAL JSON PROGRESS
      # --------------------------------------------------
      - name: Save upload progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_moment_queue.csv
          git add results/viral-moment/

          if git diff --cached --quiet; then
            echo "No upload progress changes to save."
          else
            git commit -m "Update YouTube upload progress"
            git push
          fi

      # --------------------------------------------------
      # CLEANUP
      # --------------------------------------------------
      - name: Cleanup OAuth files
        if: always()
        run: |
          rm -f token.json
          echo "OAuth cleanup completed."
