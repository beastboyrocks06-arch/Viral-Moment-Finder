name: Viral Revelation JSON Generator

on:
  schedule:
    - cron: "30 11 * * *" # Daily at 5:00 PM IST

  workflow_dispatch:
    inputs:
      channel:
        description: "Select the channel"
        required: true
        type: choice
        default: REVELATION_MOMENT
        options:
          - REVELATION_MOMENT

permissions:
  contents: write

concurrency:
  group: viral-revelation-json-generator
  cancel-in-progress: false

jobs:
  generate-json:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: ${{ github.event.inputs.channel || 'REVELATION_MOMENT' }}

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # RESTORE QWEN MODEL CACHE
      # --------------------------------------------------

      - name: Restore Qwen Model Cache
        id: qwen-cache
        uses: actions/cache/restore@v4
        with:
          path: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: qwen2.5-1.5b-instruct-q4_k-m-v1

      - name: Verify Qwen Model Cache
        run: |
          set -e

          MODEL="models/qwen2.5-1.5b-instruct-q4_k_m.gguf"

          if [ ! -s "$MODEL" ]; then
            echo "::error::Qwen model cache missing or not restored."
            echo "Run the Prepare Qwen Model workflow on the default branch first."
            exit 1
          fi

          SIZE=$(stat -c%s "$MODEL")

          if [ "$SIZE" -lt 500000000 ]; then
            echo "::error::Qwen model file is incomplete or invalid."
            exit 1
          fi

          ls -lh "$MODEL"
          echo "Qwen model cache restored successfully."

      # --------------------------------------------------
      # PYTHON SETUP
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install llama-cpp-python
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "moviepy>=2.0,<3.0"

      # --------------------------------------------------
      # VERIFY REQUIRED PROJECT FILES
      # --------------------------------------------------

      - name: Verify project files
        run: |
          set -e

          test -f viral_moment_json_generator.py
          test -f requirements.txt
          test -s models/qwen2.5-1.5b-instruct-q4_k_m.gguf

          echo "Required project files verified."

      # --------------------------------------------------
      # GOOGLE DRIVE CONNECTION TEST
      # Source videos only
      # --------------------------------------------------

      - name: Test Google Drive Connection
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_SOURCE_FOLDER_ID: ${{ secrets.GDRIVE_SOURCE_FOLDER_ID }}
        run: |
          set -e

          python - <<'PY'
          import os
          import json
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          raw = os.environ.get("GDRIVE_CREDENTIALS", "").strip()

          if not raw:
              raise RuntimeError("GDRIVE_CREDENTIALS secret is missing.")

          try:
              info = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise RuntimeError(
                  "GDRIVE_CREDENTIALS is not valid JSON."
              ) from exc

          if info.get("type") != "service_account":
              raise RuntimeError("Invalid service-account credentials.")

          credentials = Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive"]
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          folder_id = os.environ.get(
              "GDRIVE_SOURCE_FOLDER_ID", ""
          ).strip()

          if not folder_id:
              raise RuntimeError("GDRIVE_SOURCE_FOLDER_ID is missing.")

          folder = drive.files().get(
              fileId=folder_id,
              fields="id,name,mimeType",
              supportsAllDrives=True
          ).execute()

          if folder["mimeType"] != "application/vnd.google-apps.folder":
              raise RuntimeError("Source folder ID is not a folder.")

          print(f"Source folder: {folder['name']} - OK")
          print("Google Drive connection successful!")
          PY

      # --------------------------------------------------
      # GENERATE REVELATION JSON
      # --------------------------------------------------

      - name: Generate Revelation JSON files
        env:
          ENV: PROD
          CHANNEL: ${{ github.event.inputs.channel || 'REVELATION_MOMENT' }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"

          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}

          GDRIVE_SOURCE_FOLDER_ID: ${{ secrets.GDRIVE_SOURCE_FOLDER_ID }}
          GDRIVE_JSON_FOLDER_ID: ${{ secrets.GDRIVE_JSON_FOLDER_ID }}
          GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}
        run: |
          echo "Environment: $ENV"
          echo "Channel: $CHANNEL"

          python viral_moment_json_generator.py

      # --------------------------------------------------
      # COMMIT AND PUSH RESULTS
      # --------------------------------------------------

      - name: Commit generated JSON and queue updates
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- '*queue*.csv' results/

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate $CHANNEL JSON"

            git pull --rebase origin main

            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi