name: Viral Revelation YouTube Uploader

on:
  schedule:
    - cron: "50 2 * * *"  # 8:20 AM IST
    - cron: "50 14 * * *" # 8:20 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viral-revelation-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_REVELATION
      MAX_UPLOADS_PER_RUN: "1"
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_CATEGORY_ID: "24"
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}

    steps:
      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PYTHON SETUP
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-uploader-requirements.txt

      # INSTALL DEPENDENCIES
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-uploader-requirements.txt

      # VERIFY CONFIGURATION
      - name: Verify uploader configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking uploader script..."
          test -f viral_moment_clip_uploader.py

          echo "Checking queue..."
          test -f viral_revelation_queue.csv

          echo "Checking results directory..."
          test -d results/viral-revelation

          echo "Checking YouTube token file..."
          test -f viral_revelation_token.json

          python -c "import json; json.load(open('viral_revelation_token.json', encoding='utf-8'))"

          echo "Checking Google Drive token..."
          test -n "$GDRIVE_TOKEN_JSON"

          echo "Checking selected channel..."
          test "$CHANNEL" = "VIRAL_REVELATION"

          echo "Configuration checks passed."

      # UPLOAD CLIPS
      - name: Upload Viral Revelation clips
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Viral Revelation uploader..."
          echo "Channel: $CHANNEL"

          python -u viral_moment_clip_uploader.py --channel VIRAL_REVELATION

      # SAVE QUEUE AND LOCAL JSON PROGRESS
      - name: Save upload progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_revelation_queue.csv
          git add results/viral-revelation/

          if git diff --cached --quiet; then
            echo "No upload progress changes to save."
          else
            git commit -m "Update Viral Revelation upload progress"

            echo "Syncing with remote main..."
            git pull --rebase --autostash origin main

            echo "Pushing upload progress..."
            git push origin HEAD:main
          fi

      # CLEANUP
      - name: Cleanup OAuth files
        if: always()
        run: |
          rm -f viral_revelation_token.json
          echo "OAuth cleanup completed."