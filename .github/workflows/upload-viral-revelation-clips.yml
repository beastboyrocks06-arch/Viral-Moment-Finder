
name: Viral Revelation YouTube Uploader

on:
  workflow_run:
    workflows:
      - "Viral Revelation Clip Generator"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viral-revelation-uploader
  cancel-in-progress: false

jobs:
  upload:
    name: Upload Viral Revelation Clips
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      ENV: PROD
      CHANNEL: VIRAL_REVELATION
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_CATEGORY_ID: "24"
      MAX_UPLOADS_PER_RUN: "1"
      GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Verify uploader configuration
        shell: bash
        run: |
          test -f viral_moment_clip_uploader.py || {
            echo "Uploader script not found."
            exit 1
          }

          test -n "$YOUTUBE_TOKEN_B64" || {
            echo "Missing YOUTUBE_TOKEN_B64 secret."
            exit 1
          }

          test -n "$GDRIVE_TOKEN_JSON" || {
            echo "Missing GDRIVE_TOKEN_JSON secret."
            exit 1
          }

          test -n "$GDRIVE_CLIPS_FOLDER_ID" || {
            echo "Missing GDRIVE_CLIPS_FOLDER_ID secret."
            exit 1
          }

          test -f viral_revelation_queue.csv || {
            echo "Viral Revelation queue not found."
            exit 1
          }

          test -d results/viral-revelation || {
            echo "Viral Revelation results folder not found."
            exit 1
          }

          echo "Uploader configuration verified."

      - name: Upload clips to YouTube
        run: python viral_moment_clip_uploader.py

      - name: Commit upload progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_revelation_queue.csv results/viral-revelation/

          if git diff --cached --quiet; then
            echo "No upload progress changes to commit."
          else
            git commit -m "Update Viral Revelation upload progress"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
