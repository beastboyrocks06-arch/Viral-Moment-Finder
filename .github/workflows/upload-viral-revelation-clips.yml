
name: Viral Revelation YouTube Uploader

on:
  workflow_run:
    workflows:
      - "Viral Revelation Clip Generator"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-scheduled-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_REVELATION
      MAX_UPLOADS_PER_RUN: "1"
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_CATEGORY_ID: "24"
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      YOUTUBE_CHANNEL_VIRAL_REVELATION: ${{ vars.YOUTUBE_CHANNEL_VIRAL_REVELATION }}
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-uploader-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-uploader-requirements.txt

      - name: Verify uploader configuration
        run: |
          set -e
          test -f viral_moment_clip_uploader.py
          test -f viral_revelation_queue.csv
          test -d results/viral-revelation
          test -n "$YOUTUBE_TOKEN_B64"
          test -n "$YOUTUBE_CHANNEL_VIRAL_REVELATION"
          test -n "$GDRIVE_TOKEN_JSON"
          test -n "$GDRIVE_CLIPS_FOLDER_ID"
          echo "Viral Revelation uploader configuration verified."

      - name: Configure YouTube OAuth
        run: |
          set -e
          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json
          python -c "import json; json.load(open('token.json'))"

      - name: Upload clips to YouTube
        run: python viral_moment_clip_uploader.py

      - name: Commit upload progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_revelation_queue.csv results/viral-revelation/

          if git diff --cached --quiet; then
            echo "No upload progress changes to commit."
          else
            git commit -m "Update Viral Revelation upload progress"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup OAuth files
        if: always()
        run: rm -f token.json
