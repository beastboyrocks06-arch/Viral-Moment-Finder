
name: Viral Revelation YouTube Uploader

on:
  workflow_run:
    workflows:
      - "Viral Revelation Clip Generator"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viral-revelation-uploader
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_REVELATION
      MAX_UPLOADS_PER_RUN: "1"
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_CATEGORY_ID: "24"
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}

    steps:
      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PYTHON SETUP
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-uploader-requirements.txt

      # INSTALL DEPENDENCIES
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-uploader-requirements.txt

      # VERIFY CONFIGURATION
      - name: Verify uploader configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking uploader script..."
          test -f viral_moment_clip_uploader.py

          echo "Checking queue..."
          test -f viral_revelation_queue.csv

          echo "Checking results directory..."
          test -d results/viral-revelation

          echo "Checking YouTube token..."
          test -n "$YOUTUBE_TOKEN_B64"

          echo "Checking Google Drive token..."
          test -n "$GDRIVE_TOKEN_JSON"

          echo "Checking selected channel..."
          test "$CHANNEL" = "VIRAL_REVELATION"

          echo "Configuration checks passed."

      # CONFIGURE YOUTUBE OAUTH
      - name: Configure YouTube OAuth
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json

          python -c "import json; json.load(open('token.json', encoding='utf-8'))"

          echo "YouTube OAuth configured."

      # UPLOAD CLIPS
      - name: Upload Viral Revelation clips
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Viral Revelation uploader..."
          python -u viral_moment_clip_uploader.py

      # COMMIT PROGRESS
      - name: Commit upload progress
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_revelation_queue.csv results/viral-revelation/

          if git diff --cached --quiet; then
            echo "No upload progress changes to commit."
          else
            git commit -m "Update Viral Revelation upload progress"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # CLEANUP
      - name: Cleanup OAuth files
        if: always()
        run: rm -f token.json
