
name: Viral Revelation YouTube Uploader

on:
  workflow_run:
    workflows:
      - "Viral Revelation Clip Generator"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-scheduled-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ENV: PROD
      CHANNEL: VIRAL_REVELATION
      MAX_UPLOADS_PER_RUN: "1"
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_CATEGORY_ID: "24"
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      YOUTUBE_CHANNEL_VIRAL_REVELATION: ${{ vars.YOUTUBE_CHANNEL_VIRAL_REVELATION }}
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: viral-clip-uploader-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viral-clip-uploader-requirements.txt

      - name: Verify uploader configuration
        shell: bash
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CHANNEL_VIRAL_REVELATION: ${{ vars.YOUTUBE_CHANNEL_VIRAL_REVELATION }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_CLIPS_FOLDER_ID: ${{ secrets.GDRIVE_CLIPS_FOLDER_ID }}
        run: |
          echo "Checking uploader script..."
          test -f viral_moment_clip_uploader.py || exit 11

          echo "Checking queue..."
          test -f viral_revelation_queue.csv || exit 12

          echo "Checking results directory..."
          test -d results/viral-revelation || exit 13

          echo "Checking YouTube token..."
          test -n "$YOUTUBE_TOKEN_B64" || exit 14

          echo "Checking YouTube channel ID..."
          test -n "$YOUTUBE_CHANNEL_VIRAL_REVELATION" || exit 15

          echo "Checking Google Drive token..."
          test -n "$GDRIVE_TOKEN_JSON" || exit 16

          echo "Checking Google Drive folder..."
          test -n "$GDRIVE_CLIPS_FOLDER_ID" || exit 17

          echo "All configuration checks passed."

      - name: Test YouTube Channel ID variable
        env:
          CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_VIRAL_REVELATION }}
        run: |
          if [ -z "$CHANNEL_ID" ]; then
            echo "ERROR: GitHub variable is not accessible."
            exit 1
          fi
          echo "SUCCESS: Channel ID is available."
          echo "Length: ${#CHANNEL_ID}"
          

      - name: Configure YouTube OAuth
        run: |
          set -e
          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json
          python -c "import json; json.load(open('token.json'))"

      - name: Upload clips to YouTube
        shell: bash
        run: |
          set -euxo pipefail
          echo "Starting Viral Revelation uploader..."
          python -u viral_moment_clip_uploader.py

      - name: Commit upload progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add viral_revelation_queue.csv results/viral-revelation/

          if git diff --cached --quiet; then
            echo "No upload progress changes to commit."
          else
            git commit -m "Update Viral Revelation upload progress"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup OAuth files
        if: always()
        run: rm -f token.json
